name: Content Quality Gate & Build Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  qa-and-build:
    name: Content QA Audit & Astro Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Content QA Linter Agent
        run: npm run qa

      - name: Build Astro Project & Verify Static Assets
        run: npm run build
